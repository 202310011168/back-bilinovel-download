name: Build APK & Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  Build-And-Publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Get version
        id: version
        run: echo "version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi

      - name: Rename artifacts
        run: |
          mkdir -p artifacts
          VERSION="${{ steps.version.outputs.version }}"
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            base=$(basename "$f" -release.apk)
            arch=${base#app-}
            cp "$f" "artifacts/back-bilinovel-download_${VERSION}_${arch}.apk"
          done
          ls -lh artifacts/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          allowUpdates: true
          generateReleaseNotes: true
          artifacts: artifacts/*
          artifactErrorsFailBuild: true
          replacesArtifacts: true
          prerelease: false
