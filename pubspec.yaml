publish_to: 'none'
version: 0.2.44

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.8.0
  path_provider: ^2.1.5
  file_picker: ^8.1.7
  permission_handler: ^11.3.1
  share_plus: ^10.1.4
  archive: ^3.6.1
  html: ^0.15.4
  http: ^1.2.2
  path: ^1.9.1
  retry: ^3.1.2
  synchronized: ^3.3.0+3
  uuid: ^4.5.1
  xml: ^6.5.0
  fast_gbk: ^1.0.0
  logger: ^2.7.0
  shared_preferences: ^2.2.2
  crypto: ^3.0.3
  open_filex: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
